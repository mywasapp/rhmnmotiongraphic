<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>RACHMANZO Motion Assets — Batch 02</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#101727;color:#eee;font:14px system-ui}canvas{max-width:100vw;max-height:100vh;display:block;margin:auto;object-fit:contain}footer{position:fixed;bottom:8px;left:10px;opacity:.55}body.render footer{display:none}</style></head>
<body><canvas id="stage"></canvas><footer>Batch 02 preview — no text is baked into stock footage</footer>
<script>
"use strict";
const SCENE=new URLSearchParams(location.search).get("scene")||"013";
const VERTICAL=SCENE==="024", CW=VERTICAL?1080:1920,CH=VERTICAL?1920:1080;
const canvas=document.getElementById("stage"),ctx=canvas.getContext("2d",{alpha:false});
canvas.width=CW*2;canvas.height=CH*2;
const TAU=Math.PI*2, sin=Math.sin,cos=Math.cos,PI=Math.PI;
const frac=v=>v-Math.floor(v), rnd=x=>frac(sin(x*127.1+78.233)*43758.5453123);
const mix=(a,b,t)=>a+(b-a)*t;
function clear(a,b){const g=ctx.createLinearGradient(0,0,CW,CH);g.addColorStop(0,a);g.addColorStop(1,b);ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);}
function line(x,y,X,Y,c,w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke();}
function halo(x,y,r,c){const g=ctx.createRadialGradient(x,y,1,x,y,r);g.addColorStop(0,c);g.addColorStop(1,"transparent");ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);}
function ellipse(x,y,rx,ry,c,w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.stroke();}
function poly(points,fill,stroke,width=1){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}}
function circle(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=c;ctx.fill();}
function texture(t,quantity=1000){for(let i=0;i<quantity;i++){const x=rnd(i+11)*CW,y=rnd(i+19)*CH,alpha=.015+.022*rnd(i+90);ctx.fillStyle="rgba(255,255,255,"+alpha+")";ctx.fillRect(x+1.4*sin(TAU*t+i),y+1.4*cos(TAU*t+i),1.2,1.2);}}
function bars(x,y,w,h,n,base){for(let i=0;i<n;i++){ctx.fillStyle=i%2?base:"rgba(255,255,255,.05)";ctx.fillRect(x+i*w/n,y,Math.max(1,w/n-4),h);}}
function scene013(t){ // Aerospace orbital telemetry
clear("#03152b","#102640");halo(1420,500,700,"rgba(27,165,224,.20)");
for(let j=0;j<17;j++){const r=80+j*31;ellipse(1380,550,r,r*.61,"rgba(59,178,216,"+(.20-j*.007)+")",j%4===0?3:1);}
for(let i=0;i<8;i++){const a=TAU*(t*(i%2?1:-1)+rnd(i));const r=135+i*52;const x=1380+r*cos(a),y=550+.61*r*sin(a);halo(x,y,30,"rgba(80,222,255,.55)");circle(x,y,4,"#c8f8ff");}
for(let i=0;i<80;i++){const y=80+i*12;line(0,y,620,y,"rgba(108,192,225,"+(.03+.03*sin(i))+")",1);}
for(let i=0;i<55;i++){const p=frac(i/55+t);line(670+p*750,200+rnd(i)*650,685+p*750,200+rnd(i)*650,"rgba(159,233,246,.2)",1.5);}
}
function scene014(t){ // Logistics: moving isometric cargo geometry
clear("#f0f4f1","#c6dedb");halo(1470,80,570,"rgba(245,187,89,.22)");
function cube(x,y,s,hue){const a=[x,y],b=[x+s,y-s*.45],c=[x+2*s,y],d=[x+s,y+s*.45];poly([a,b,c,d],hue,"rgba(35,69,86,.20)",1);poly([a,d,[d[0],d[1]+s],[x,y+s]],"#317b87");poly([d,c,[c[0],c[1]+s],[d[0],d[1]+s]],"#244e65");}
for(let row=0;row<6;row++){const y=190+row*145;line(200,y+122,1680,y+122,"rgba(55,99,105,.24)",5);for(let j=0;j<9;j++){let p=frac(j/9+t*(row%2?-.35:.35));cube(100+p*1660,y,26+row*2,(j+row)%3===0?"#efbc73":"#b0dad5");}}
for(let i=0;i<12;i++){const x=140+i*155;line(x,0,x+470,1080,"rgba(44,99,103,.075)",2);}
}
function scene015(t){ // Clean medical ECG pulses
clear("#092733","#03131e");for(let y=0;y<CH;y+=36)line(0,y,CW,y,"rgba(36,204,196,.09)",1);
for(let x=0;x<CW;x+=36)line(x,0,x,CH,"rgba(36,204,196,.075)",1);
halo(990,510,420,"rgba(15,185,162,.12)");
for(let track=0;track<4;track++){const baseline=235+track*210;ctx.beginPath();for(let x=0;x<CW;x+=4){const p=frac(x/280-t*2),d=Math.abs(p-.52),peak=Math.max(0,1-d/.07);const y=baseline-peak*(track===1?120:62)+14*sin(x/100+track*3);if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.strokeStyle=track===1?"#5aefcf":"rgba(73,201,186,.55)";ctx.lineWidth=track===1?5:2;ctx.shadowBlur=track===1?19:0;ctx.shadowColor="#60ffce";ctx.stroke();ctx.shadowBlur=0;}
for(let i=0;i<16;i++){let x=frac(i/16+t)*CW;circle(x,930,3,"rgba(117,247,216,.55)");}
}
function scene016(t){ // rose gold optical folds
clear("#211a25","#593e43");halo(1420,320,640,"rgba(250,167,154,.24)");
for(let j=0;j<15;j++){ctx.beginPath();for(let x=-60;x<CW+60;x+=10){const v=x/CW;const y=120+j*60+80*sin(TAU*(v*.8+t)+j*.17)+35*sin(TAU*(v*1.5-t)+j*.33);if(x===-60)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.strokeStyle=j%3===0?"rgba(255,218,193,.8)":j%3===1?"rgba(227,151,143,.45)":"rgba(117,75,85,.6)";ctx.lineWidth=j%3===0?10:4;ctx.shadowBlur=j%3===0?18:0;ctx.shadowColor="#e6a28f";ctx.stroke();ctx.shadowBlur=0;}
for(let j=0;j<6;j++)halo(230+j*290,270+200*sin(j*2),150,"rgba(255,210,185,.07)");
}
function scene017(t){ // sunlight and solar array field
clear("#133b4a","#051824");const sx=1490,sy=190;halo(sx,sy,530,"rgba(255,213,89,.36)");circle(sx,sy,73,"#ffe5a2");for(let i=0;i<40;i++){const a=TAU*i/40+t*TAU*.1;line(sx+93*cos(a),sy+93*sin(a),sx+170*cos(a),sy+170*sin(a),"rgba(248,226,155,.17)",2);}
for(let r=0;r<10;r++){const z=1/(1+r*.16),y=390+r*72;for(let c=0;c<16;c++){const x=100+c*118*(1+.04*r)-r*23;poly([[x,y],[x+98*z,y-24*z],[x+88*z,y+48*z],[x-10*z,y+72*z]],r%2?"#28647a":"#17445d","rgba(106,210,232,.48)",1.5);line(x+43*z,y-12*z,x+38*z,y+60*z,"rgba(118,211,242,.22)",1);}}texture(t,900);
}
function scene018(t){ // industrial gear mechanisms
clear("#101722","#1f2935");halo(1190,510,650,"rgba(241,156,68,.19)");
function gear(x,y,r,n,phase){ctx.save();ctx.translate(x,y);ctx.rotate(phase);const pts=[];for(let i=0;i<n*4;i++){const a=TAU*i/(n*4),rr=(i%4===0||i%4===3)?r*1.11:r;pts.push([rr*cos(a),rr*sin(a)]);}poly(pts,"#364754","#eea86a",4);circle(0,0,r*.67,"#12222d");for(let s=0;s<6;s++){const a=TAU*s/6;line(0,0,r*.57*cos(a),r*.57*sin(a),"#c69b78",17);}circle(0,0,r*.2,"#b1c4ca");circle(0,0,r*.11,"#1c333d");ctx.restore();}
gear(1190,540,245,18,TAU*t);gear(1580,700,155,14,-TAU*t*18/14);gear(750,830,110,12,-TAU*t*18/12);
for(let i=0;i<34;i++){let y=i*36;line(0,y,490,y,"rgba(176,190,200,.065)",1.5);}texture(t,800);
}
function scene019(t){ // server corridor
clear("#050d1d","#0a2434");halo(960,480,600,"rgba(28,146,233,.21)");
const vx=1000,vy=510;for(let s=0;s<10;s++){const q=s/10,scale=1/(.35+q*1.6);for(const sign of [-1,1]){const x=vx+sign*(120+570*q);const w=110*scale,h=300*scale,y=vy-h*.5;poly([[x-w*.5,y],[x+w*.5,y],[x+w*.5,y+h],[x-w*.5,y+h]],"#14273d","rgba(99,189,230,.30)",3);for(let b=0;b<10;b++){let yy=y+(b+.5)*h/11;line(x-w*.37,yy,x+w*.37,yy,"rgba(95,186,224,.35)",2);circle(x+w*.3,yy,2.5,(b+s)%3===0?"#46e1b9":"#37516b");}}}
for(let j=0;j<17;j++){const a=j*TAU/17;let r=frac(t*1.5+j/17);halo(vx+(r-.5)*930,vy+sin(a)*r*390,34,"rgba(61,224,255,.4)");}
line(0,1060,vx,vy,"rgba(28,174,224,.36)",4);line(CW,1060,vx,vy,"rgba(28,174,224,.36)",4);
}
function scene020(t){ // white modern architecture
clear("#eff1ec","#c6d1c7");halo(1520,150,650,"rgba(255,245,213,.66)");
for(let i=0;i<8;i++){const x=80+i*240;ctx.fillStyle=i%2===0?"#ecf0e9":"#d8dfd6";ctx.fillRect(x,120+i%3*80,190,940);ctx.beginPath();ctx.arc(x+95,150+i%3*80,95,PI,0);ctx.fill();ctx.strokeStyle="rgba(121,145,137,.32)";ctx.lineWidth=2;ctx.stroke();}
for(let i=0;i<9;i++){let x=i*260-210+65*sin(TAU*t+i*.5);poly([[x,1080],[x+170,1080],[x+740,120],[x+650,120]],"rgba(64,91,83,.045)");}
for(let j=0;j<80;j++){let x=rnd(j+250)*CW,y=rnd(j+150)*CH;circle(x,y,1,"rgba(46,74,71,.12)");}
}
function scene021(t){ // eclipse / spectral corona
clear("#080a25","#1b0e32");const x=1340,y=510;halo(x,y,510,"rgba(79,59,219,.25)");halo(x,y,380,"rgba(57,174,239,.18)");
for(let j=0;j<180;j++){const a=TAU*j/180,amp=18+30*(.5+.5*sin(j*2.33+TAU*t));line(x+203*cos(a),y+203*sin(a),x+(230+amp)*cos(a),y+(230+amp)*sin(a),j%3?"rgba(116,174,249,.34)":"rgba(244,130,239,.6)",j%7===0?3:1);}
circle(x,y,216,"#050719");ellipse(x,y,220,220,"rgba(222,176,252,.78)",8);
for(let i=0;i<6;i++){let a=TAU*(t+i/6);halo(x+320*cos(a),y+320*sin(a),70,"rgba(96,184,248,.10)");}texture(t,900);
}
function scene022(t){ // crystalline facets geometry
clear("#0b2b3c","#06212a");halo(1350,340,640,"rgba(47,212,209,.16)");
const s=178;for(let yy=-1;yy<8;yy++){for(let xx=-1;xx<12;xx++){const x=xx*s+(yy%2)*s*.5,y=yy*s*.75;const p=sin(TAU*t+xx*.4+yy*.7),q=cos(TAU*t+yy*.27);poly([[x,y],[x+s,y],[x+s*.5,y+s*.78]],p>0?"rgba(50,164,178,.26)":"rgba(45,88,125,.39)","rgba(127,223,228,.26)",1.2);poly([[x,y],[x+s*.5,y+s*.78],[x+s*.12,y+s*.54]],q>0?"rgba(120,218,220,.22)":"rgba(22,60,80,.44)",null);}}
for(let i=0;i<30;i++){const a=TAU*(t+i/30),r=120+23*i;const x=1260+r*.3*cos(a),y=450+r*.13*sin(a);halo(x,y,34,"rgba(129,248,232,.10)");}
}
function scene023(t){ // warm organic paper layers
clear("#f1e2d0","#c7ae9d");const colors=["#d2b8a0","#e5c9ab","#ca947f","#ebbb9a","#e4a78c","#f2d9c7"];
for(let j=0;j<11;j++){ctx.beginPath();const base=150+j*102;ctx.moveTo(-50,CH+90);for(let x=-30;x<=CW+40;x+=18){const y=base+50*sin(TAU*(x/CW*.78+t)+j*.23)+25*cos(TAU*(x/CW*1.4-t)+j*.33);ctx.lineTo(x,y);}ctx.lineTo(CW+40,CH+90);ctx.closePath();ctx.fillStyle=colors[j%colors.length];ctx.shadowBlur=27;ctx.shadowColor="rgba(71,53,43,.18)";ctx.fill();ctx.shadowBlur=0;}
for(let i=0;i<180;i++){let x=rnd(i+17)*CW,y=rnd(i+23)*CH;circle(x,y,.9,"rgba(83,55,43,.09)");}
}
function scene024(t){ // vertical northern lights for shorts
clear("#021b25","#062f34");for(let j=0;j<9;j++){const x=75+j*115;ctx.beginPath();for(let y=-40;y<CH+50;y+=16){const wave=115*sin(TAU*(y/CH*.9+t)+j*.3)+28*sin(TAU*(y/CH*2-t)+j);const xx=x+wave;if(y===-40)ctx.moveTo(xx,y);else ctx.lineTo(xx,y);}ctx.strokeStyle=j%3===0?"rgba(109,255,191,.55)":j%3===1?"rgba(22,201,216,.4)":"rgba(82,144,230,.35)";ctx.lineWidth=44-j*2;ctx.shadowColor=j%2?"#25f3d1":"#3ba9e8";ctx.shadowBlur=56;ctx.stroke();ctx.shadowBlur=0;}
for(let i=0;i<90;i++){const x=rnd(i+13)*CW,y=rnd(i+29)*CH,bright=.2+.5*rnd(i+47);circle(x,y,.7+rnd(i)*2,"rgba(222,254,252,"+bright+")");}halo(610,620,450,"rgba(66,231,207,.10)");}
const S={"013":scene013,"014":scene014,"015":scene015,"016":scene016,"017":scene017,"018":scene018,"019":scene019,"020":scene020,"021":scene021,"022":scene022,"023":scene023,"024":scene024};
function renderAtTime(seconds){const t=frac(seconds/10);ctx.setTransform(canvas.width/CW,0,0,canvas.height/CH,0,0);ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";S[SCENE](t);return true;}
window.renderAtTime=renderAtTime;window.RHMN_RENDER_INFO={scene:SCENE,width:canvas.width,height:canvas.height,duration:10,fps:30};
if(new URLSearchParams(location.search).has("render"))document.body.classList.add("render");
renderAtTime(0);
if(!new URLSearchParams(location.search).has("render")){const start=performance.now();function tick(){renderAtTime((performance.now()-start)/1000);requestAnimationFrame(tick)}requestAnimationFrame(tick);}
</script></body></html>
